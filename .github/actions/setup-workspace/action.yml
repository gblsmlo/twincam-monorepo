name: Setup Workspace
description: Pinned toolchain and a warm dependency cache, identical in every job.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        # For npm, yarn and pnpm only: it does not reach Bun's store, which is
        # why the cache below exists.
        package-manager-cache: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # The key is the lockfile and nothing else. `restore-keys` is safe here and
    # only here: the store is content-addressed per package, and
    # `--frozen-lockfile` still resolves exactly what the lockfile says, so an
    # older cache warms the download without changing what gets installed.
    - name: Cache Bun Store
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
